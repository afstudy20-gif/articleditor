[package]
name = "articleditor"
version = "0.1.0"
description = "Article Editor desktop shell"
authors = ["DrTR Tools"]
license = ""
repository = "https://github.com/afstudy20-gif/articleditor"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "articleditor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
